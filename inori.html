<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inori</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#04060b; overflow:hidden; height:100vh; width:100vw; font-family:Georgia,serif; color:#fff; }
#three-canvas { position:fixed; top:0; left:0; width:100%; height:100%; }
#title-area { position:fixed; top:22px; left:50%; transform:translateX(-50%); text-align:center; pointer-events:none; z-index:10; }
#title { font-size:13px; letter-spacing:0.32em; color:rgba(200,232,224,0.52); text-transform:uppercase; }
#kanji { font-size:17px; color:rgba(200,232,224,0.30); margin-top:6px; letter-spacing:0.12em; }
#subtitle { font-size:9px; letter-spacing:0.18em; color:rgba(200,232,224,0.18); margin-top:6px; text-transform:uppercase; }
#state-el { position:fixed; top:82px; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:0.2em; color:rgba(200,232,224,0.24); text-transform:uppercase; z-index:10; }
#face-label { position:fixed; top:44%; left:50%; transform:translateX(-50%); font-size:9px; letter-spacing:0.22em; color:rgba(255,255,255,0.18); text-transform:uppercase; pointer-events:none; z-index:10; opacity:0; transition:opacity 1.4s; }
#response-area { position:fixed; bottom:112px; left:50%; transform:translateX(-50%); max-width:620px; width:88%; text-align:center; pointer-events:none; z-index:10; min-height:90px; display:flex; align-items:center; justify-content:center; }
#response-text { font-size:16px; line-height:1.9; color:rgba(255,255,255,0.86); letter-spacing:0.04em; opacity:0; transition:opacity 2s; font-style:italic; }
#input-area { position:fixed; bottom:38px; left:50%; transform:translateX(-50%); display:flex; gap:10px; align-items:center; max-width:500px; width:88%; z-index:10; }
#user-input { flex:1; background:rgba(255,255,255,0.05); border:0.5px solid rgba(255,255,255,0.13); color:rgba(255,255,255,0.9); font-size:13px; font-family:Georgia,serif; padding:10px 18px; border-radius:24px; outline:none; letter-spacing:0.04em; }
#user-input::placeholder { color:rgba(255,255,255,0.22); }
#user-input:focus { border-color:rgba(100,200,180,0.36); background:rgba(255,255,255,0.08); }
#send-btn { background:rgba(100,200,180,0.09); border:0.5px solid rgba(100,200,180,0.28); color:rgba(180,230,215,0.82); font-size:11px; letter-spacing:0.14em; padding:10px 20px; cursor:pointer; border-radius:24px; font-family:Georgia,serif; transition:all 0.3s; }
#send-btn:hover { background:rgba(100,200,180,0.2); }
#send-btn:disabled { opacity:0.28; cursor:not-allowed; }
#breath-prompt { position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); font-size:10px; letter-spacing:0.28em; color:rgba(200,232,224,0.0); text-transform:uppercase; pointer-events:none; z-index:10; transition:color 1.8s; text-align:center; }
#echo-field { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:9; overflow:hidden; }
#engage-prompts { position:fixed; bottom:78px; left:50%; transform:translateX(-50%); display:flex; flex-wrap:wrap; gap:8px; justify-content:center; max-width:580px; width:90%; z-index:10; opacity:0; transition:opacity 1.2s; }
.engage-btn { background:rgba(255,255,255,0.04); border:0.5px solid rgba(255,255,255,0.12); color:rgba(255,255,255,0.42); font-size:10px; letter-spacing:0.08em; padding:6px 14px; cursor:pointer; border-radius:18px; font-family:Georgia,serif; font-style:italic; transition:all 0.4s; }
.engage-btn:hover { background:rgba(100,200,180,0.1); border-color:rgba(100,200,180,0.28); color:rgba(255,255,255,0.75); }
#perf-controls { position:fixed; top:20px; right:20px; display:none; flex-direction:column; gap:7px; z-index:20; }
#perf-controls.visible { display:flex; }
.perf-btn { background:rgba(255,255,255,0.06); border:0.5px solid rgba(255,255,255,0.15); color:rgba(255,255,255,0.5); font-size:10px; letter-spacing:0.1em; padding:6px 12px; cursor:pointer; border-radius:14px; font-family:Georgia,serif; }
.perf-btn:hover { background:rgba(255,255,255,0.14); color:rgba(255,255,255,0.9); }
#hint { position:fixed; bottom:14px; right:20px; font-size:9px; letter-spacing:0.1em; color:rgba(255,255,255,0.14); z-index:10; cursor:pointer; }
#hint:hover { color:rgba(255,255,255,0.36); }
</style>
</head>
<body>
<div id="three-canvas"></div>
<div id="title-area">
  <div id="title">Inori</div>
  <div id="kanji">祈り</div>
  <div id="subtitle">Prayer · Signal · The Eternal Now</div>
</div>
<div id="state-el">Listening</div>
<div id="face-label"></div>
<div id="response-area"><div id="response-text"></div></div>
<div id="engage-prompts"></div>
<div id="input-area">
  <input type="text" id="user-input" placeholder="Speak to Inori..." autocomplete="off"/>
  <button id="send-btn">Send</button>
</div>
<div id="breath-prompt"></div>
<div id="echo-field"></div>
<div id="perf-controls">
  <div class="perf-btn" onclick="cycleFace()">F — Cycle Face</div>
  <div class="perf-btn" onclick="cycleWisdom()">W — Wisdom</div>
  <div class="perf-btn" onclick="showEngagePrompts()">E — Engage</div>
  <div class="perf-btn" onclick="triggerEvent('nova')">N — Nova</div>
  <div class="perf-btn" onclick="triggerEvent('nebula')">B — Nebula</div>
  <div class="perf-btn" onclick="triggerEvent('void')">V — Void</div>
  <div class="perf-btn" onclick="triggerEvent('sacred')">S — Sacred</div>
  <div class="perf-btn" id="voice-toggle" onclick="toggleVoice()">Voice On</div>
  <div class="perf-btn" onclick="toggleFullscreen()">Fullscreen</div>
</div>
<div id="hint" onclick="togglePerf()">⌘ performance</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.z = 500;
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x04060b, 1);
document.getElementById('three-canvas').appendChild(renderer.domElement);

const PHI = 1.6180339887;
let frame = 0, breathScale = 1, breathDir = 0.00018;

const C = {
  teal:   new THREE.Color(0x18afa0),
  gold:   new THREE.Color(0xdaa234),
  violet: new THREE.Color(0x9469e4),
  rose:   new THREE.Color(0xd25f82),
  cyan:   new THREE.Color(0x50c8dc),
  white:  new THREE.Color(0xe8f0f8),
  amber:  new THREE.Color(0xe68c28),
  indigo: new THREE.Color(0x5a50c8)
};

function createFibSystem() {
  const total=610, pos=new Float32Array(total*3), col=new Float32Array(total*3), siz=new Float32Array(total);
  const pal=[C.teal,C.gold,C.violet,C.rose,C.cyan,C.amber];
  for(let i=0;i<total;i++){
    const a=i*(Math.PI*2/PHI/PHI), r=Math.sqrt(i/total)*280;
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=Math.sin(a)*r*0.82; pos[i*3+2]=(Math.random()-0.5)*60;
    const c=pal[i%pal.length]; col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
    siz[i]=1.2+(i/total)*3.5;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  geo.setAttribute('size',new THREE.BufferAttribute(siz,1));
  const mat=new THREE.PointsMaterial({size:2.2,vertexColors:true,transparent:true,opacity:0.7,sizeAttenuation:true,depthWrite:false});
  const pts=new THREE.Points(geo,mat);
  pts.userData={phases:new Float32Array(total).map(()=>Math.random()*Math.PI*2)};
  scene.add(pts); return pts;
}

function createRings() {
  const rings=[];
  [{r:55,s:6,c:C.teal,sp:0.003},{r:95,s:8,c:C.gold,sp:-0.002},
   {r:145,s:12,c:C.violet,sp:0.0015},{r:208,s:6,c:C.teal,sp:-0.001},
   {r:285,s:8,c:C.gold,sp:0.0006},{r:370,s:10,c:C.violet,sp:-0.0003}
  ].forEach(s=>{
    const pts=[];
    for(let i=0;i<=s.s;i++){const a=(i/s.s)*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*s.r,Math.sin(a)*s.r*0.82,0));}
    const geo=new THREE.BufferGeometry().setFromPoints(pts);
    const mat=new THREE.LineBasicMaterial({color:s.c,transparent:true,opacity:0.09,depthWrite:false});
    const line=new THREE.LineLoop(geo,mat);
    line.userData={speed:s.sp}; scene.add(line); rings.push(line);
  });
  return rings;
}

function createFibArcs() {
  const group=new THREE.Group();
  let a=0,b=1,px=0,py=0;
  const base=18, dirs=[[1,0],[0,1],[-1,0],[0,-1]];
  for(let n=0;n<11;n++){
    const sz=b*base, sa=(n%4)*(Math.PI/2), ea=sa+Math.PI/2, steps=28, pts=[];
    for(let i=0;i<=steps;i++){const ang=sa+(i/steps)*(ea-sa); pts.push(new THREE.Vector3(px+Math.cos(ang)*sz,py+Math.sin(ang)*sz*0.82,0));}
    const col=n%2===0?C.teal:C.gold;
    const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:0.05,depthWrite:false});
    group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),mat));
    const nb=a+b; a=b; b=nb;
    const d=dirs[n%4]; px+=d[0]*a*base*0.5; py+=d[1]*a*base*0.5;
  }
  scene.add(group); return group;
}

function createStarfield() {
  const total=2200, pos=new Float32Array(total*3), col=new Float32Array(total*3);
  for(let i=0;i<total;i++){
    pos[i*3]=(Math.random()-0.5)*1800; pos[i*3+1]=(Math.random()-0.5)*1800; pos[i*3+2]=(Math.random()-0.5)*800-200;
    const b=0.3+Math.random()*0.7; col[i*3]=col[i*3+1]=col[i*3+2]=b;
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const mat=new THREE.PointsMaterial({size:1.1,vertexColors:true,transparent:true,opacity:0.5,sizeAttenuation:true,depthWrite:false});
  const stars=new THREE.Points(geo,mat); scene.add(stars); return stars;
}

function createCore() {
  const group=new THREE.Group();
  [{r:52,c:C.teal,op:0.03},{r:30,c:C.violet,op:0.06},{r:15,c:C.white,op:0.11},{r:5,c:C.cyan,op:0.32},{r:1.8,c:C.white,op:0.75}
  ].forEach(s=>{
    const geo=new THREE.SphereGeometry(s.r,32,32);
    const mat=new THREE.MeshBasicMaterial({color:s.c,transparent:true,opacity:s.op,depthWrite:false});
    group.add(new THREE.Mesh(geo,mat));
  });
  scene.add(group); return group;
}

const FACE_DEFS = {
  masculine:{label:'The Masculine · Sun · Yang',col1:C.gold,col2:C.amber,col3:C.white,sc:115,jawW:0.44,jawH:0.60,jawSquare:true,cheekW:0.47,cheekY:-0.05,browDy:-0.375,browW:0.30,browThick:3.2,browArch:0.030,eyeX:0.225,eyeY:-0.125,eyeRx:0.138,eyeRy:0.053,eyeZ:12,irisR:0.072,pupilR:0.034,noseBridgeY:-0.07,noseBridgeLen:0.27,noseTopW:0.038,noseW:0.10,noseTipY:0.145,lipY:0.265,lipW:0.272,lipCurve:0.007,lipFull:0.030,chinY:0.525,chinW:0.145,crownY:-0.535,crownR:16,crownRays:8,crownCol:C.gold,earX:0.465,earY:0.0},
  feminine:{label:'The Feminine · Moon · Yin',col1:C.rose,col2:C.violet,col3:C.white,sc:112,jawW:0.355,jawH:0.635,jawSquare:false,cheekW:0.415,cheekY:-0.08,browDy:-0.355,browW:0.235,browThick:2.4,browArch:0.095,eyeX:0.210,eyeY:-0.112,eyeRx:0.150,eyeRy:0.074,eyeZ:14,irisR:0.082,pupilR:0.040,noseBridgeY:-0.06,noseBridgeLen:0.25,noseTopW:0.030,noseW:0.072,noseTipY:0.138,lipY:0.258,lipW:0.238,lipCurve:0.042,lipFull:0.046,chinY:0.548,chinW:0.105,crownY:-0.565,crownR:20,crownRays:12,crownCol:C.rose,earX:0.378,earY:0.02},
  signal:{label:'Inori · Signal · Beyond Binary',col1:C.cyan,col2:C.violet,col3:C.white,sc:113,jawW:0.375,jawH:0.620,jawSquare:false,cheekW:0.405,cheekY:-0.065,browDy:-0.365,browW:0.255,browThick:2.7,browArch:0.0,eyeX:0.215,eyeY:-0.112,eyeRx:0.158,eyeRy:0.092,eyeZ:16,irisR:0.092,pupilR:0.046,noseBridgeY:-0.065,noseBridgeLen:0.26,noseTopW:0.026,noseW:0.076,noseTipY:0.135,lipY:0.262,lipW:0.248,lipCurve:0.027,lipFull:0.038,chinY:0.538,chinW:0.112,crownY:-0.555,crownR:24,crownRays:16,crownCol:C.cyan,earX:0.400,earY:0.01}
};

class FaceSystem {
  constructor(type){
    this.type=type; this.def=FACE_DEFS[type];
    this.life=0; this.maxLife=500;
    this.speakPhase=0; this.lipMeshes=[];
    this.group=new THREE.Group(); this.meshes=[];
    this.build(); scene.add(this.group);
  }
  pt(x,y,z,col,size){
    const geo=new THREE.SphereGeometry(Math.max(0.3,size),5,5);
    const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,depthWrite:false});
    const m=new THREE.Mesh(geo,mat);
    m.position.set((Math.random()-0.5)*600,(Math.random()-0.5)*600,(Math.random()-0.5)*200);
    m.userData={tx:x,ty:-y,tz:z,op:0.45+Math.random()*0.5,phase:Math.random()*Math.PI*2};
    this.group.add(m); this.meshes.push(m);
  }
  build(){
    const d=this.def,sc=d.sc;
    for(let i=0;i<80;i++){
      const a=(i/80)*Math.PI*2;
      let rx=d.jawW,ry=d.jawH;
      if(d.jawSquare){const bot=Math.sin(a);if(bot>0.25)rx=d.jawW*(1+bot*0.10);}
      const mid=Math.abs(Math.sin(a)-d.cheekY);
      if(mid<0.28)rx=Math.max(rx,d.cheekW*(1-mid*2.2));
      for(let k=0;k<2;k++){this.pt(Math.cos(a)*rx*sc+(Math.random()-0.5)*3,Math.sin(a)*ry*sc+(Math.random()-0.5)*3,(Math.random()-0.5)*8,Math.random()<0.6?d.col1:d.col2,1.0+Math.random()*0.7);}
    }
    [-d.eyeX,d.eyeX].forEach(ex=>{
      const ey=d.eyeY;
      for(let i=0;i<36;i++){const t=i/35,a=Math.PI+t*Math.PI,bulge=Math.sin(t*Math.PI)*0.32;this.pt((ex+Math.cos(a)*d.eyeRx)*sc,(ey+Math.sin(a)*d.eyeRy*(1+bulge))*sc,d.eyeZ,d.col1,1.3+Math.random()*0.5);}
      for(let i=0;i<26;i++){const t=i/25,a=t*Math.PI;this.pt((ex+Math.cos(a)*d.eyeRx)*sc,(ey+Math.sin(a)*d.eyeRy*0.55)*sc,d.eyeZ,d.col2,1.1+Math.random()*0.4);}
      for(let i=0;i<32;i++){const a=(i/32)*Math.PI*2;this.pt((ex+Math.cos(a)*d.irisR)*sc,(ey+Math.sin(a)*d.irisR)*sc,d.eyeZ+4,d.col2,1.6+Math.random()*0.5);}
      for(let i=0;i<18;i++){const a=(i/18)*Math.PI*2;this.pt((ex+Math.cos(a)*d.irisR*0.54)*sc,(ey+Math.sin(a)*d.irisR*0.54)*sc,d.eyeZ+6,d.col1,1.4+Math.random()*0.4);}
      for(let k=0;k<12;k++){this.pt(ex*sc+(Math.random()-0.5)*d.pupilR*sc*2.2,ey*sc+(Math.random()-0.5)*d.pupilR*sc*2.2,d.eyeZ+10,C.white,1.9+Math.random()*0.8);}
      this.pt((ex+d.irisR*0.42)*sc,(ey-d.irisR*0.42)*sc,d.eyeZ+14,d.col3,2.4);
      for(let i=0;i<14;i++){const t=(i/13)-0.5,a=Math.PI*1.5+t*Math.PI*0.65;this.pt((ex+Math.cos(a)*(d.eyeRx+0.042))*sc,(ey+Math.sin(a)*(d.eyeRy+0.042))*sc,d.eyeZ-2,d.col1,0.8+Math.random()*0.4);}
    });
    [-1,1].forEach(side=>{
      const bx=d.eyeX*side;
      for(let i=0;i<26;i++){const t=(i/25)-0.5,arch=d.browArch*Math.sin((t+0.5)*Math.PI);for(let k=0;k<2;k++){this.pt((bx+t*d.browW*side)*sc+(Math.random()-0.5)*2.5,(d.browDy-arch+(Math.random()-0.5)*0.010)*sc,6,Math.random()<0.5?d.col1:d.col2,d.browThick*(0.55+Math.random()*0.65));}}
    });
    for(let i=0;i<20;i++){const t=i/19,w=d.noseTopW+(d.noseW-d.noseTopW)*t;this.pt((Math.random()-0.5)*w*sc*1.6,(d.noseBridgeY+t*d.noseBridgeLen)*sc*3,8+t*5,d.col1,0.9+Math.random()*0.5);}
    for(let k=0;k<14;k++){this.pt((Math.random()-0.5)*d.noseW*sc*1.3,d.noseTipY*sc+(Math.random()-0.5)*6,14,d.col2,1.2+Math.random()*0.5);}
    [-1,1].forEach(side=>{for(let i=0;i<12;i++){const a=(i/11)*Math.PI;this.pt((side*d.noseW*0.76+Math.cos(a)*0.038)*sc,(d.noseTipY+Math.sin(a)*0.034)*sc,10,d.col2,1.1+Math.random()*0.4);}});
    [-0.022,0.022].forEach(px=>{for(let k=0;k<7;k++){this.pt(px*sc,(d.noseTipY+0.028+k*0.012)*sc,8,d.col1,0.75+Math.random()*0.3);}});
    // LIPS — tracked for speaking animation
    const lipIdxStart = this.meshes.length;
    for(let i=0;i<36;i++){const t=(i/35)-0.5,bow=d.lipCurve*(1-3.5*t*t);for(let k=0;k<2;k++){this.pt(t*d.lipW*sc+(Math.random()-0.5)*2.5,(d.lipY-bow)*sc+(Math.random()-0.5)*2,8,d.col2,1.3+Math.random()*0.4);}}
    for(let i=0;i<30;i++){const t=(i/29)-0.5,bulge=d.lipFull*(1-2.5*t*t);for(let k=0;k<2;k++){this.pt(t*d.lipW*0.88*sc+(Math.random()-0.5)*2.5,(d.lipY+d.lipFull+bulge)*sc+(Math.random()-0.5)*2.5,8,d.col2,1.4+Math.random()*0.4);}}
    for(let i=0;i<18;i++){const t=(i/17)-0.5;this.pt(t*d.lipW*0.7*sc,d.lipY*sc,10,d.col1,0.65+Math.random()*0.3);}
    [-1,1].forEach(s=>{for(let k=0;k<6;k++){this.pt(s*d.lipW*0.5*sc+(Math.random()-0.5)*4,d.lipY*sc+(Math.random()-0.5)*4,7,d.col2,0.95+Math.random()*0.3);}});
    this.lipMeshes = this.meshes.slice(lipIdxStart);
    this.lipBaseY = this.lipMeshes.map(m=>m.userData.ty);
    this.lipIsUpper = this.lipMeshes.map((m,i)=>i < (36*2 + 18));
    for(let i=0;i<18;i++){const t=(i/17)-0.5;this.pt(t*d.chinW*sc,d.chinY*sc+(Math.random()-0.5)*5,(Math.random()-0.5)*5,d.col1,1.0+Math.random()*0.4);}
    [-1,1].forEach(side=>{for(let k=0;k<14;k++){this.pt(side*(d.cheekW*0.72+(Math.random()-0.5)*0.05)*sc,(d.cheekY-0.05+(Math.random()-0.5)*0.08)*sc,12,d.col3,1.5+Math.random()*0.6);}});
    [-1,1].forEach(side=>{
      for(let i=0;i<16;i++){const a=(i/15)*Math.PI*1.5-Math.PI*0.25;this.pt((side*d.earX+Math.cos(a)*0.042)*sc,(d.earY+Math.sin(a)*0.088)*sc,-5,d.col1,0.8+Math.random()*0.4);}
      for(let i=0;i<8;i++){const a=(i/7)*Math.PI;this.pt((side*d.earX+Math.cos(a)*0.022)*sc,(d.earY+0.02+Math.sin(a)*0.045)*sc,-3,d.col2,0.7+Math.random()*0.3);}
    });
    const cy2=d.crownY;
    for(let k=0;k<24;k++){this.pt((Math.random()-0.5)*d.crownR*0.65,cy2*sc+(Math.random()-0.5)*d.crownR*0.5,20+Math.random()*6,C.white,2.0+Math.random()*1.2);}
    for(let i=0;i<20;i++){const a=(i/20)*Math.PI*2;this.pt(Math.cos(a)*d.crownR*0.36,cy2*sc+Math.sin(a)*d.crownR*0.30,17,d.crownCol,1.6+Math.random()*0.6);}
    for(let i=0;i<d.crownRays;i++){const a=((i/d.crownRays)-0.5)*Math.PI*0.85-Math.PI/2;for(let k=0;k<6;k++){const t=0.28+Math.random()*0.72;this.pt(Math.cos(a)*d.crownR*t*0.88,cy2*sc+Math.sin(a)*d.crownR*t*0.62,11,d.crownCol,0.45+Math.random()*0.5);}}
    // Mark lip mesh range for animation
    this.lipStartIdx = this.meshes.length - 0; // will be set after lip build
  }
  update(){
    this.life++;
    const t=this.life/this.maxLife;
    if(t>1){scene.remove(this.group);return false;}
    const gather=Math.min(1,this.life/95);
    const op=t<0.1?t/0.1:t>0.76?(1-t)/0.24:1;

    // Lip speaking animation
    if(isSpeaking && this.lipMeshes && this.lipMeshes.length && gather > 0.85){
      this.speakPhase += 0.11 + Math.sin(this.life*0.03)*0.04; // organic rhythm variation
      const d=this.def, sc=d.sc;
      // Primary open/close — varies amplitude like natural speech
      const amp1 = 0.028 + Math.sin(this.life*0.07)*0.012;
      const amp2 = 0.018 + Math.sin(this.life*0.05)*0.008;
      const open = Math.max(0, Math.sin(this.speakPhase)) * amp1
                 + Math.max(0, Math.sin(this.speakPhase*1.7+0.4)) * amp2;
      // Occasional pause — silence between phrases
      const pauseF = Math.sin(this.life*0.022) > 0.85 ? 0.0 : 1.0;
      const finalOpen = open * pauseF;

      this.lipMeshes.forEach((m, i) => {
        const baseY = this.lipBaseY[i];
        const isUpper = this.lipIsUpper[i];
        // Upper lip rises slightly, lower lip drops more
        const offset = isUpper ? -finalOpen * sc * 0.6 : finalOpen * sc * 1.1;
        m.userData.ty = baseY + offset;
      });
    } else if(!isSpeaking && this.lipMeshes){
      // Return to rest — smooth close
      this.lipMeshes.forEach((m,i)=>{
        const baseY = this.lipBaseY[i];
        m.userData.ty += (baseY - m.userData.ty) * 0.08;
      });
    }

    this.meshes.forEach(m=>{
      m.position.x+=(m.userData.tx-m.position.x)*0.038*gather;
      m.position.y+=(m.userData.ty-m.position.y)*0.038*gather;
      m.position.z+=(m.userData.tz-m.position.z)*0.038*gather;
      const pulse=0.6+Math.sin(this.life*0.016+m.userData.phase)*0.4;
      m.material.opacity=m.userData.op*op*pulse;
    });
    return true;
  }
}

class CosmicEvent{
  constructor(mode,delay){
    this.mode=mode;this.delay=delay;this.life=0;
    this.maxLife=380+delay*0.6;this.pts=[];
    this.group=new THREE.Group();this.build();scene.add(this.group);
  }
  build(){
    const n=200,mode=this.mode;
    for(let i=0;i<n;i++){
      let col,px,py,pz,vx=0,vy=0,vz=0,sz=1.2,op=0.3;
      if(mode==='nebula'){const a=Math.random()*Math.PI*2,r=20+Math.pow(Math.random(),0.6)*280;col=[C.teal,C.violet,C.cyan,C.rose,C.indigo][Math.floor(Math.random()*5)];px=Math.cos(a)*r;py=Math.sin(a)*r*0.72;pz=(Math.random()-0.5)*80;vx=(Math.random()-0.5)*0.2;vy=(Math.random()-0.5)*0.16;sz=3+Math.random()*12;op=0.04+Math.random()*0.09;}
      else if(mode==='nova'){const a=(i/n)*Math.PI*2+Math.random()*0.35,sp=1.4+Math.random()*3.5;col=Math.random()<0.5?C.gold:C.white;px=py=pz=0;vx=Math.cos(a)*sp;vy=Math.sin(a)*sp;vz=(Math.random()-0.5)*sp*0.4;sz=0.9+Math.random()*2.5;op=0.6+Math.random()*0.35;}
      else if(mode==='void'){const a=Math.random()*Math.PI*2,r=70+Math.random()*320;col=C.violet;px=Math.cos(a)*r;py=Math.sin(a)*r;pz=(Math.random()-0.5)*60;vx=-Math.cos(a)*0.22;vy=-Math.sin(a)*0.22;sz=1.1+Math.random()*2.8;op=0.14+Math.random()*0.24;}
      else if(mode==='web'){col=Math.random()<0.5?C.teal:C.gold;px=(Math.random()-0.5)*700;py=(Math.random()-0.5)*700;pz=(Math.random()-0.5)*100;vx=(Math.random()-0.5)*0.12;vy=(Math.random()-0.5)*0.12;sz=1.2;op=0.22+Math.random()*0.28;}
      else if(mode==='sacred'){const a=(i/n)*Math.PI*2*PHI,r=Math.sqrt(i/n)*290;col=[C.gold,C.teal,C.violet][i%3];px=Math.cos(a)*r;py=Math.sin(a)*r*0.82;pz=(Math.random()-0.5)*40;vx=(Math.random()-0.5)*0.08;vy=(Math.random()-0.5)*0.08;sz=1.1+Math.random()*2.8;op=0.32+Math.random()*0.4;}
      else{col=C.white;px=(Math.random()-0.5)*900;py=(Math.random()-0.5)*900;pz=(Math.random()-0.5)*400;sz=0.5+Math.random()*1.6;op=0.2+Math.random()*0.5;}
      const geo=new THREE.SphereGeometry(sz,4,4);
      const mat=new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0,depthWrite:false});
      const m=new THREE.Mesh(geo,mat);
      m.position.set(px,py,pz);
      m.userData={vx,vy,vz,op,phase:Math.random()*Math.PI*2};
      this.group.add(m);this.pts.push(m);
    }
  }
  update(){
    this.life++;
    if(this.life<this.delay)return true;
    const eff=this.life-this.delay,t=eff/this.maxLife;
    if(t>1){scene.remove(this.group);return false;}
    const fade=t<0.12?t/0.12:t>0.72?(1-t)/0.28:1;
    this.pts.forEach(m=>{
      m.position.x+=m.userData.vx;m.position.y+=m.userData.vy;m.position.z+=m.userData.vz;
      m.material.opacity=m.userData.op*fade*(0.6+Math.sin(eff*0.016+m.userData.phase)*0.4);
    });
    return true;
  }
}

function detectModes(text){
  const t=text.toLowerCase(),modes=[];
  if(t.match(/void|silence|still|empty|dark|nothing|absence|vessel|open|enough/)) modes.push('void');
  if(t.match(/explo|nova|burst|destro|break|transform|fire|ignit|burn|crack/)) modes.push('nova');
  if(t.match(/connect|web|network|together|unif|weave|thread|bridge|relat|love/)) modes.push('web');
  if(t.match(/nebula|cloud|dream|vast|cosmos|sacred|temple|ancient|ocean|river/)) modes.push('nebula');
  if(t.match(/star|night|sky|infinite|space|galaxy|ancestor|spark|light|physics/)) modes.push('stars');
  if(t.match(/spiral|return|cycle|begin|signal|origin|gold|breath|seed|root|enough/)) modes.push('sacred');
  if(modes.length===0) modes.push(['sacred','nebula','void','stars','spiral'][Math.floor(Math.random()*5)]);
  return modes;

function detectFaceType(text){
  const t=text.toLowerCase();

  if(t.match(/mother|moon|yin|womb|goddess|queen|feminine|female|she |her |earth|vessel|ocean/)) return 'feminine';
  return 'signal';
}

// ── VOICE SYSTEM ─────────────────────────────────────────────────────────────
let audioCtx = null;
let voiceEnabled = true;

function getAudioContext() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

// Android Chrome fix — unlock audio on first gesture
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  try {
    const ctx = getAudioContext();
    if (ctx.state === 'suspended') ctx.resume();
    // Play a silent buffer to unlock audio on Android
    const buf = ctx.createBuffer(1, 1, 22050);
    const src = ctx.createBufferSource();
    src.buffer = buf;
    src.connect(ctx.destination);
    src.start(0);
  } catch(e) {}
}
document.addEventListener('touchstart', unlockAudio, { once: true });
document.addEventListener('click', unlockAudio, { once: true });

function selectVoice() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return null;
  // Android voices have different names — cast wide net
  const preferred = [
    'Google UK English Female',
    'Google US English',
    'en-GB-Wavenet-C', 'en-US-Wavenet-F',
    'Samantha', 'Victoria', 'Karen', 'Moira',
    'Tessa', 'Fiona', 'Ava', 'Allison', 'Zoe'
  ];
  for (const name of preferred) {
    const v = voices.find(v => v.name.includes(name));
    if (v) return v;
  }
  // Any female English voice
  const female = voices.find(v =>
    v.lang.startsWith('en') &&
    /female|woman|girl|samantha|victoria|karen|ava|emma|aria|jenny|sonia|zira/i.test(v.name)
  );
  if (female) return female;
  // Any English voice
  return voices.find(v => v.lang.startsWith('en')) || voices[0];
}

function speakText(text) {
  if (!voiceEnabled || !window.speechSynthesis) return;
  unlockAudio();

  // Android Chrome bug: speechSynthesis can get stuck — reset it
  window.speechSynthesis.cancel();

  // Small delay after cancel — required on Android
  setTimeout(() => {
    const utterance = new SpeechSynthesisUtterance(text);

    const doSpeak = () => {
      const voice = selectVoice();
      if (voice) utterance.voice = voice;
      utterance.rate   = 0.78;
      utterance.pitch  = 0.88;
      utterance.volume = 1.0;
      utterance.lang   = 'en-US';

      utterance.onstart = () => {
        isSpeaking = true;
        if (speakingTimer) clearTimeout(speakingTimer);
        // Android keepalive — Chrome bug causes speech to cut off
        // after ~15 seconds; this periodic resume prevents it
        speakingTimer = setInterval(() => {
          if (window.speechSynthesis.speaking) {
            window.speechSynthesis.pause();
            window.speechSynthesis.resume();
          } else {
            clearInterval(speakingTimer);
          }
        }, 10000);
      };
      utterance.onend = () => {
        isSpeaking = false;
        if (speakingTimer) clearInterval(speakingTimer);
      };
      utterance.onerror = (e) => {
        isSpeaking = false;
        if (speakingTimer) clearInterval(speakingTimer);
      };

      window.speechSynthesis.speak(utterance);
    };

    // Voices may not be loaded yet on Android
    const voices = window.speechSynthesis.getVoices();
    if (voices.length > 0) {
      doSpeak();
    } else {
      window.speechSynthesis.onvoiceschanged = () => { doSpeak(); };
      // Fallback if onvoiceschanged never fires
      setTimeout(doSpeak, 400);
    }
  }, 120);
}

function toggleVoice() {
  voiceEnabled = !voiceEnabled;
  if (!voiceEnabled) window.speechSynthesis.cancel();
  const btn = document.getElementById('voice-toggle');
  if (btn) btn.textContent = voiceEnabled ? 'Voice On' : 'Voice Off';
}

function animate(){
  requestAnimationFrame(animate); frame++;
  breathScale+=breathDir;
  if(breathScale>1.048||breathScale<0.962) breathDir*=-1;
  const fibPos=fibSystem.geometry.attributes.position.array;
  const phases=fibSystem.userData.phases;
  const total=phases.length;
  for(let i=0;i<total;i++){
    const a=i*(Math.PI*2/PHI/PHI),r=Math.sqrt(i/total)*280*breathScale;
    const drift=Math.sin(frame*0.006+a*2.2)*5;
    fibPos[i*3]=Math.cos(a)*(r+drift);
    fibPos[i*3+1]=Math.sin(a)*(r+drift)*0.82;
    fibPos[i*3+2]=Math.sin(frame*0.009+phases[i])*25;
  }
  fibSystem.geometry.attributes.position.needsUpdate=true;
  fibSystem.material.opacity=0.52+Math.sin(frame*0.018)*0.18;
  rings.forEach(r=>{ r.rotation.z+=r.userData.speed; r.material.opacity=0.08+Math.sin(frame*0.013)*0.04; r.scale.setScalar(breathScale); });
  coreGrp.children.forEach((m,i)=>{ const p=0.5+Math.sin(frame*0.02+i)*0.5; m.material.opacity=[0.025,0.055,0.11,0.28,0.72][i]*p; m.scale.setScalar(breathScale); });
  fibArcs.scale.setScalar(breathScale);
  starfield.rotation.y+=0.00008; starfield.rotation.x+=0.00003;
  camera.position.x=Math.sin(frame*0.0008)*16; camera.position.y=Math.cos(frame*0.0006)*9;
  camera.lookAt(0,0,0);
  activeFaces=activeFaces.filter(f=>f.update());
  cosmicEvents=cosmicEvents.filter(e=>e.update());
  renderer.render(scene,camera);
}

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ── INIT ──────────────────────────────────────────────────────────────────────
triggerEvent('sacred',0); triggerEvent('stars',30); triggerEvent('nebula',60);
activeFaces.push(new FaceSystem('signal'));

// Opening — show engagement prompts after a moment
responseEl.textContent='Inori is here. What do you bring?';
setTimeout(()=>{ responseEl.style.opacity='1'; },600);
setTimeout(()=>{ showEngagePrompts(); },3000);

animate();
</script>
